# Codecov reports coverage; it does not gate merges.
#
# `project` compares against a historical baseline that predates the tsdown /
# vitest-browser migration, so it reads -24% on every branch and fails checks
# that have nothing to do with coverage. Blocking merges on a stale comparison
# trains people to click through a red check, which is worse than not having
# the check at all.
#
# Coverage enforcement belongs in vitest `thresholds`, next to the tests, where
# it is versioned with the code and fails locally as well as in CI. Each
# package's vitest.config.ts sets that floor (#302), so codecov reports the
# trend and both statuses stay non-blocking.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
