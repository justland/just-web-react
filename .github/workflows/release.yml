name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: justland/.github/.github/workflows/pnpm-verify.yml@main
    with:
      os: '["ubuntu-latest"]'

  # Publishes through npm trusted publishing (OIDC). Every published package needs a
  # trusted publisher registered at npmjs.com/package/<name>/access naming this repo and
  # *this* file (release.yml) — npm validates the caller, not the reusable workflow.
  #
  # The permissions block is required, not decorative: the repo's default workflow token
  # is `read`, and a callee can only narrow what the caller grants. Without it the run
  # fails at resolution with no jobs and no logs.
  release:
    uses: justland/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v1
    needs: code
    permissions:
      id-token: write
      contents: write
      pull-requests: write
